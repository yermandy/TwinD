[project]
name = "TwinD"
version = "1.0.0"
description = "TwinD: Generalizing Deepfake Detection from Blending to Entire Face Synthesis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    # the versions TwinD was trained and tested with
    "torch==2.10.0",
    "torchvision==0.25.0",
    "timm==1.0.29",
    "numpy",
    "pandas",
    "pillow",
    "opencv-python-headless",
    "scikit-learn",
    "huggingface-hub",
    "pyarrow",
    "safetensors",
    "tqdm",
    "imageio",
    "av",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
